name: "httpbin smoke test"
base_url: "https://httpbin.org"
timeout: 10.0

steps:
  - name: health
    method: GET
    url: /get
    expect_status: 200

  - name: post-data
    method: POST
    url: /post
    headers:
      Content-Type: application/json
    body:
      source: "flowforge"
      message: "hello"
    expect_status: 200

  - name: status-check
    method: GET
    url: /status/200
    expect_status: 200
